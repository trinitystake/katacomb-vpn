name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The privileged helper is a Go module (daemon/). The toolchain is pinned by
      # its go.mod; scripts/build-daemon.sh refuses any other version, so what CI
      # builds is what the maintainer builds.
      #
      # Read the `toolchain` line, NOT go-version-file. go-version-file resolves the
      # `go` DIRECTIVE (go 1.27) to the newest patch of that minor, which is not the
      # pin: the day Go 1.27.1 shipped, CI installed it, build-daemon.sh correctly
      # refused it, and the v1.9.0 run failed on a tree that builds fine. Deriving the
      # version from the same line the script asserts against is what stops the two
      # from drifting again.
      - name: Read the pinned Go toolchain
        id: gotoolchain
        run: echo "version=$(sed -n 's/^toolchain go//p' daemon/go.mod)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.gotoolchain.outputs.version }}
          cache-dependency-path: daemon/go.sum

      - name: Typecheck
        run: npm run typecheck

      # go vet + go mod verify + a static, reproducible build, failing loudly on
      # any of them (electron-builder would only warn on the missing file).
      - name: Build the privileged helper
        run: npm run build:daemon

      - name: Unit tests
        run: npm test

      # Blocking gate for anything critical. Kept separate from the high-severity
      # report below because the transitive `elliptic` advisory (GHSA-848j-6mx2-7j84,
      # high, no upstream fix — dormant fallback under the vendored JS SDK's native
      # secp256k1) would otherwise make every run red.
      - name: Security audit (critical, blocking)
        run: npm audit --omit=dev --audit-level=critical

      # Informational: surfaces new high/moderate/low advisories without failing the
      # build. Review these on each run; drop the elliptic exception once the JS
      # SDK moves off it.
      - name: Security audit (full report, non-blocking)
        run: npm audit --omit=dev || true
