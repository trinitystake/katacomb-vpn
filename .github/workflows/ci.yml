name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The privileged helper is a Go module (daemon/). The toolchain is pinned by
      # its go.mod; scripts/build-daemon.sh refuses any other version, so what CI
      # builds is what the maintainer builds.
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Typecheck
        run: npm run typecheck

      # go vet + go mod verify + a static, reproducible build, failing loudly on
      # any of them (electron-builder would only warn on the missing file).
      - name: Build the privileged helper
        run: npm run build:daemon

      - name: Unit tests
        run: npm test

      # Blocking gate for anything critical. Kept separate from the high-severity
      # report below because the transitive `elliptic` advisory (GHSA-848j-6mx2-7j84,
      # high, no upstream fix — dormant fallback under the vendored JS SDK's native
      # secp256k1) would otherwise make every run red.
      - name: Security audit (critical, blocking)
        run: npm audit --omit=dev --audit-level=critical

      # Informational: surfaces new high/moderate/low advisories without failing the
      # build. Review these on each run; drop the elliptic exception once the JS
      # SDK moves off it.
      - name: Security audit (full report, non-blocking)
        run: npm audit --omit=dev || true
