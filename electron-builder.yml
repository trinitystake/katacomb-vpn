appId: com.katacomb.vpn
productName: Katacomb VPN
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  # The daemon ships unbundled via extraResources (run by Electron-as-node from a
  # real filesystem path); keep it out of the asar to avoid a confusing duplicate.
  - "!out/daemon/**"
  # electron-vite already inlines every runtime dependency into out/, so the
  # production node_modules tree (~120 MB) is dead weight in the asar. The only
  # remaining externals are ws's optional native deps, which gracefully no-op.
  - "!node_modules/**"
# Ship only English UI strings (saves ~39 MB of Chromium locale .pak files).
electronLanguages:
  - en-US
extraResources:
  - from: resources/linux/
    to: linux/
    filter:
      - "**/*"
      - "!v2ray/"
  - from: resources/linux/v2ray/
    to: linux/v2ray/
    filter:
      - "**/*"
  # Standalone root-daemon bundle → /opt/Katacomb VPN/resources/daemon/index.js
  - from: out/daemon/index.js
    to: daemon/index.js
  # The app is GPL-3.0-or-later and ships GPL-2.0 binaries (awg/awg-quick), so the
  # licence text and the source offer must accompany the binaries, not just the repo.
  - from: LICENSE
    to: ../LICENSE
  - from: THIRD-PARTY-LICENSES.md
    to: ../THIRD-PARTY-LICENSES.md
  # App icons → resources/icons/ so main (getIconPath) can load them at runtime.
  # `linux.icon` below only sets the launcher/desktop icon; it is NOT a path
  # readable via nativeImage.createFromPath, so without this copy the About
  # dialog's icon renders as a broken-image triangle in the packaged app.
  - from: build/icons/
    to: icons/
    filter:
      - "**/*"
  # Badged per-state tray icons (getTrayIconPath). Deliberately a sibling of
  # build/icons/ rather than a subdirectory of it: `linux.icon` derives the
  # launcher icon set from the PNGs it finds under build/icons, and a badged
  # 32x32 must not be a candidate for it.
  - from: build/tray/
    to: tray/
    filter:
      - "**/*"
linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icons
  # An AppImage carries no package metadata, so it cannot declare the libasound2
  # the deb declares below, and Chromium hard-links libasound.so.2 (DT_NEEDED on
  # the main binary). A host without it, or with only Ubuntu's partial OSS4 shim,
  # kills the app at exec with a linker/symbol error and no dialog. So the AppImage
  # carries its own copy: AppRun exports LD_LIBRARY_PATH=$APPDIR/usr/lib, which is
  # where electron-builder already stages libXtst/libnotify/libXss.
  #
  # This is `linux.extraFiles` and not `appImage.extraFiles` because the schema has
  # no per-target extraFiles (AppImageOptions/DebOptions both lack it, checked in
  # app-builder-lib/scheme.json). Landing in the deb too is harmless and deliberate:
  # the binary's RPATH is bare `$ORIGIN`, NOT `$ORIGIN/usr/lib`, so under the deb
  # this file is on no search path and the system libasound2t64 keeps winning. Do
  # not "tidy" it to the app root, that WOULD shadow the system copy for deb users.
  #
  # Deliberately libasound only. libgbm.so.1 is missing in the same situations, but
  # it is bound to the host's mesa DRI drivers, and since LD_LIBRARY_PATH takes
  # precedence over the system a bundled copy would shadow mesa for every AppImage
  # user, including the ones it currently works for. A host with no libgbm has no
  # graphics stack to run a GUI app on anyway. libasound has no such coupling: the
  # app never plays audio, it only needs the symbols to resolve.
  #
  # Extracted from a debian:bookworm container (alsa-lib 1.2.8-1+b1), never from the
  # maintainer's desktop, for the same reason scripts/build-amneziawg.sh builds in a
  # container: a native copy inherits this machine's glibc and would refuse to load
  # on older targets. Floor is GLIBC_2.34, under every supported release, and it
  # needs only libc/libm. Re-check that floor if this is ever refreshed.
  extraFiles:
    - from: resources/appimage/libasound.so.2
      to: usr/lib/libasound.so.2
    - from: resources/appimage/LICENSE.libasound
      to: usr/lib/LICENSE.libasound
  # First line of the deb control Description (the synopsis). Without it the
  # field is emitted with an empty first line, which reads as a blank package
  # summary in apt/Discover listings.
  synopsis: Decentralized VPN client for the Sentinel network
  desktop:
    entry:
      Name: Katacomb VPN
      Comment: Decentralized VPN Client
      Categories: Network;VPN;Security;
deb:
  depends:
    # --- Electron's own runtime libraries -----------------------------------
    # These nine ARE electron-builder's getDefaultDepends("deb") and must be
    # repeated verbatim: setting `depends` REPLACES that default list instead of
    # extending it, so listing only our extras shipped a package that declared
    # none of Chromium's shared libraries. It installs fine on a full GNOME/KDE
    # desktop (they're already present) and then fails at the dynamic linker on
    # a minimal, XFCE or netinst system. libgtk-3-0 and libatspi2.0-0 are
    # virtual on Ubuntu 24.04+, satisfied by their t64 successors, so the
    # unsuffixed names are correct on both old and new releases.
    # Re-check this list against FpmTarget.getDefaultDepends on upgrade.
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    # NOT in getDefaultDepends, and both are hard DT_NEEDED entries of the
    # Electron binary rather than dlopen'd extras: when either is missing the
    # dynamic linker refuses to start the app at all ("error while loading shared
    # libraries: … cannot open shared object file"), before any window or log
    # line exists. Verified in a debian:bookworm container holding nothing but
    # this package's declared dependencies.
    # libasound2 is missing on a plain minimal install; libgbm1 additionally goes
    # missing under `apt-get --no-install-recommends`, which is where the GL stack
    # stops arriving transitively (it comes in via Recommends somewhere in this
    # dependency set, never via anyone's Depends).
    #
    # MUST stay an alternation, and the t64 name MUST come first. On Ubuntu 24.04
    # `libasound2` is a *virtual* name with more than one provider, and the one apt
    # picks unprompted is `liboss4-salsa-asound2` — an OSS4 shim implementing only a
    # subset of the ALSA API. The package then installs cleanly, passes `ldd` with
    # zero unresolved libraries, and dies the moment it is executed:
    #   symbol lookup error: undefined symbol: snd_device_name_get_hint, version ALSA_0.9
    # Naming the real package first makes the choice deterministic. Debian 12 and
    # Ubuntu 22.04 have no libasound2t64 and fall through to the second alternative,
    # where `libasound2` is a real package and so beats any provider. Verified by
    # installing and executing on all four. libgbm1 needs no alternation: it is a
    # real package, un-renamed, on every target.
    - libasound2t64 | libasound2
    - libgbm1
    # Also load-bearing for us specifically: Electron dlopens libsecret-1.so.0
    # for safeStorage, and without a real keyring backend
    # isSecureStorageAvailable() is false and NO wallet can be persisted
    # (settings.ts throws INSECURE_STORAGE_MESSAGE) — unusable, not degraded.
    - libsecret-1-0
    # --- Katacomb VPN specifics ---------------------------------------------
    - wireguard-tools
    # MUST stay an alternation. `policykit-1` alone made the package
    # uninstallable on Debian 13 (trixie): it was already a transitional package
    # in bookworm and is absent from trixie, where pkexec ships as its own
    # package. Ubuntu 22.04 is the mirror image — policykit-1 exists, a `pkexec`
    # package does not — so only the alternation installs on both.
    - pkexec | policykit-1
    # kill-switch.ts shells out to iptables. Debian 12+ defaults to the nftables
    # backend and does not guarantee the iptables package is installed.
    - iptables
    # OpenVPN (node type 3) runs the distro client rather than a bundled build:
    # it's a TLS client, so distro OpenSSL security updates are a better supply
    # chain than a binary we'd have to re-cut on every CVE. Same model as
    # wireguard-tools above. AppImage/dev users install it themselves.
    - openvpn
  recommends:
    # NOTE: setting this key REPLACES electron-builder's default recommends
    # rather than adding to it (FpmTarget: options.recommends ? asArray(it) :
    # getDefaultRecommends()), so the default must be repeated here or the tray
    # icon silently loses its library. Same replace-don't-merge trap as
    # afterInstall — see the header of resources/linux/postinstall.sh.
    - libappindicator3-1
    # libsecret is only a client — it needs a Secret Service daemon to talk to.
    # GNOME and KDE ship different ones and a bare XFCE/LXQt install has neither.
    # An alternation (not a plain Depends) so KDE boxes are satisfied by the
    # kwallet they already have instead of pulling in gnome-keyring.
    - gnome-keyring | kwalletmanager
  afterInstall: resources/linux/postinstall.sh
  afterRemove: resources/linux/postrm.sh
appImage:
  artifactName: katacomb-vpn-${version}.AppImage
