appId: com.sentinel.dvpn
productName: Sentinel dVPN
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  # The daemon ships unbundled via extraResources (run by Electron-as-node from a
  # real filesystem path); keep it out of the asar to avoid a confusing duplicate.
  - "!out/daemon/**"
extraResources:
  - from: resources/linux/
    to: linux/
    filter:
      - "**/*"
      - "!v2ray/"
  - from: resources/linux/v2ray/
    to: linux/v2ray/
    filter:
      - "**/*"
  # Standalone root-daemon bundle → /opt/Sentinel dVPN/resources/daemon/index.js
  - from: out/daemon/index.js
    to: daemon/index.js
linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icons
  desktop:
    Name: Sentinel dVPN
    Comment: Decentralized VPN Client
    Categories: Network;VPN;Security;
deb:
  depends:
    - wireguard-tools
    - policykit-1
  afterInstall: resources/linux/postinstall.sh
  afterRemove: resources/linux/postrm.sh
appImage:
  artifactName: sentinel-dvpn-${version}.AppImage
